<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KitCode Counter Widget</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=VT323&display=swap');

        :root {
            --bg-color: #0c0c0c;
            --red-color: #f03030;
            --white-text: #e0e0e0;
            --font-mono: 'Fira Code', monospace;
            --font-pixel: 'VT323', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Widget Container chính - Viền nét liền màu đỏ dày 2px */
        .widget-window {
            width: 100%;
            max-width: 820px;
            background-color: var(--bg-color);
            border: 2px solid var(--red-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        /* Title Bar - Các chấm đỏ góc trái */
        .title-bar {
            padding: 10px 14px 6px 14px;
            display: flex;
            gap: 8px;
            border-bottom: 1px solid var(--red-color);
        }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            border: 1px solid var(--red-color);
        }

        .dot.filled {
            background-color: var(--red-color);
        }

        /* Thân Widget */
        .widget-body {
            padding: 24px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        /* Label KITCODE COUNTER */
        .brand-label {
            color: var(--red-color);
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 700;
            line-height: 1.25;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Chỉ số Phần trăm */
        .percentage {
            color: var(--white-text);
            font-family: var(--font-pixel), var(--font-mono);
            font-size: 38px;
            letter-spacing: 2px;
            line-height: 1;
        }

        /* Thanh Progress Bar - Top/Bottom = 2px solid, Left/Right = 1px dashed */
        .progress-box {
            border-top: 2px solid var(--white-text);
            border-bottom: 2px solid var(--white-text);
            border-left: 1px dashed var(--white-text);
            border-right: 1px dashed var(--white-text);
            padding: 6px 8px;
            width: 200px;
            height: 42px;
            display: flex;
            align-items: center;
        }

        .progress-blocks {
            display: flex;
            gap: 3px;
            width: 100%;
            height: 100%;
        }

        .block-column {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 8px;
            height: 100%;
        }

        .block-line {
            height: 3px;
            background-color: var(--white-text);
            width: 100%;
        }

        /* Các khối Metrics (COUNT, WORKED, IDLE) */
        .metrics-group {
            display: flex;
            align-items: flex-end;
            gap: 28px;
        }

        .metric-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .metric-value {
            color: var(--white-text);
            font-family: var(--font-pixel), var(--font-mono);
            font-size: 32px;
            line-height: 1;
            margin-bottom: 4px;
            letter-spacing: 1px;
        }

        .metric-label {
            color: var(--red-color);
            font-family: var(--font-mono);
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Nút CLAIM - Top/Bottom = 2px solid red, Left/Right = 1px dashed red */
        .claim-btn {
            background: transparent;
            color: var(--white-text);
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 1.5px;
            padding: 12px 24px;
            cursor: pointer;
            text-transform: uppercase;
            border-top: 2px solid var(--red-color);
            border-bottom: 2px solid var(--red-color);
            border-left: 1px dashed var(--red-color);
            border-right: 1px dashed var(--red-color);
            transition: background-color 0.2s ease;
        }

        .claim-btn:hover {
            background-color: rgba(240, 48, 48, 0.15);
        }
    </style>
</head>
<body>

    <div class="widget-window">
        <!-- Title bar dots -->
        <div class="title-bar">
            <div class="dot filled"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <!-- Widget Content -->
        <div class="widget-body">
            <!-- Brand -->
            <div class="brand-label">
                KITCODE<br>COUNTER
            </div>

            <!-- Percentage -->
            <div class="percentage">
                33%
            </div>

            <!-- Custom Retro Progress Bar -->
            <div class="progress-box">
                <div class="progress-blocks">
                    <!-- 33% Progress Block Columns -->
                    <div class="block-column">
                        <div class="block-line"></div><div class="block-line"></div>
                        <div class="block-line"></div><div class="block-line"></div>
                    </div>
                    <div class="block-column">
                        <div class="block-line"></div><div class="block-line"></div>
                        <div class="block-line"></div><div class="block-line"></div>
                    </div>
                    <div class="block-column">
                        <div class="block-line"></div><div class="block-line"></div>
                        <div class="block-line"></div><div class="block-line"></div>
                    </div>
                    <div class="block-column">
                        <div class="block-line"></div><div class="block-line"></div>
                        <div class="block-line"></div><div class="block-line"></div>
                    </div>
                    <div class="block-column">
                        <div class="block-line"></div><div class="block-line"></div>
                        <div class="block-line"></div><div class="block-line"></div>
                    </div>
                    <div class="block-column">
                        <div class="block-line"></div><div class="block-line"></div>
                        <div class="block-line"></div><div class="block-line"></div>
                    </div>
                </div>
            </div>

            <!-- Metrics -->
            <div class="metrics-group">
                <div class="metric-item">
                    <div class="metric-value">105</div>
                    <div class="metric-label">= COUNT</div>
                </div>
                <div class="metric-item">
                    <div class="metric-value">26m</div>
                    <div class="metric-label">WORKED</div>
                </div>
                <div class="metric-item">
                    <div class="metric-value">12s</div>
                    <div class="metric-label">IDLE</div>
                </div>
            </div>

            <!-- Claim Button -->
            <button class="claim-btn">CLAIM</button>
        </div>
    </div>

</body>
</html>
